[package]
name = "nuff-pulse"
version = "0.1.0"
edition = "2021"
description = "Windows widget listing active local Claude and GitHub Copilot agent sessions"
license = "MIT"
publish = false

[lib]
name = "nuff_pulse"
path = "src/lib.rs"

[[bin]]
name = "nuff-pulse"
path = "src/main.rs"

[dependencies]
serde_json = "1"
notify = { version = "8", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
